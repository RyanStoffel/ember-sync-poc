app = "ember-sync-poc"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DASHBOARD_PORT = "8080"
  OAUTH_BASE_URL = "https://ember-sync-poc.fly.dev"
  JIRA_USE_SIMULATOR = "false"
  JIRA_BASE_URL = "https://ember-capstone.atlassian.net"
  JIRA_PROJECT_KEY = "ESP"
  EMBER_DATA_DIR = "/data"
  GITHUB_POLL_MS = "5000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "ember_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
